apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: taskboard20-api
  labels:
    app: taskboard20-api
    app.kubernetes.io/name: taskboard20-api
    app.kubernetes.io/part-of: taskboard20
    app.kubernetes.io/managed-by: gitops-app
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: kube-system
  hostnames:
  - taskboard20-api.taskboard20-staging.localhost
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: taskboard20-api
      port: 80
